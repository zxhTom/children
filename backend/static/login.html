<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 家庭时光机</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fdf2f8; color: #334155; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
        main { width: min(100%, 400px); padding: 36px; border-radius: 20px; background: white; box-shadow: 0 20px 55px #83184318; }
        .mark { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: #fce7f3; color: #be185d; font-size: 29px; }
        h1 { margin: 22px 0 6px; font-size: 26px; color: #1e293b; }
        p { margin: 0 0 28px; color: #64748b; }
        label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; }
        input:focus { outline: 2px solid #f9a8d4; border-color: #db2777; }
        button { width: 100%; margin-top: 25px; padding: 13px; border: 0; border-radius: 10px; background: #db2777; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #error { min-height: 22px; margin-top: 12px; color: #be123c; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">🌱</div>
        <h1>家庭时光机</h1>
        <p>登录后查看成长日记与健康记录</p>
        <form id="loginForm">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <div style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:#475569;">
                <input id="remember" name="remember" type="checkbox" style="width:auto;cursor:pointer;">
                <label for="remember" style="margin:0;font-weight:normal;cursor:pointer;">记住登录30天</label>
            </div>
            <button id="submit" type="submit">登录</button>
            <div id="error" role="alert" aria-live="polite"></div>
        </form>
    </main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('submit');
            const error = document.getElementById('error');
            button.disabled = true;
            error.textContent = '';
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                        remember_me: document.getElementById('remember').checked
                    })
                });
                if (!response.ok) { error.textContent = response.status === 429 ? '尝试次数过多，请五分钟后再试' : '用户名或密码错误'; return; }
                location.replace('/');
            } catch (_) {
                error.textContent = '连接失败，请稍后重试';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
