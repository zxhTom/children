server {
    listen 80;
    listen [::]:80;
    server_name children.port.zxhtom.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name children.port.zxhtom.store;

    ssl_certificate /etc/nginx/cert/children-portmap/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/children-portmap/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($ssl_server_name != $host) { return 421; }

    client_max_body_size 0;
    location / {
        proxy_pass http://127.0.0.1:9881;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portmap_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
